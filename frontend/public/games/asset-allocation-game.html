<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产配置练习 · 财商教育</title>
<style>
body{margin:0;background:#eef1f6;padding:24px 12px 48px;font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6;color:#2b2f36}
.ag-card{max-width:680px;margin:0 auto;padding:26px 28px 30px;border-radius:20px;background:linear-gradient(160deg,#fdf6ec,#eef3fb);box-shadow:0 10px 40px rgba(20,30,60,.14)}
.ag-badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:1px;color:#8a5a00;background:#ffe9b8;padding:3px 12px;border-radius:999px;margin-bottom:12px}
.ag-title{margin:0 0 6px;font-size:30px;font-weight:800}
.ag-sub{margin:0 0 18px;color:#5b6270;font-size:15px}
.ag-back{background:none;border:none;cursor:pointer;color:#2b6cb0;font-size:14px;font-weight:700;padding:0 0 14px;font-family:inherit}
.ag-back:hover{text-decoration:underline}
.ag-home-cards{display:flex;flex-direction:column;gap:12px}
.ag-home-card{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #e4e8f0;border-radius:16px;padding:18px 20px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left;font-family:inherit}
.ag-home-card:hover{border-color:#2b6cb0;transform:translateY(-2px)}
.ag-home-emoji{font-size:32px;flex:none}
.ag-home-title{font-size:17px;font-weight:800;margin:0 0 2px}
.ag-home-desc{font-size:13px;color:#6a7180;margin:0}
.ag-home-arrow{margin-left:auto;color:#b0b7c4;font-size:20px;flex:none}
.ag-tabs{display:flex;gap:8px;margin-bottom:18px}
.ag-tab{flex:1;border:2px solid #e4e8f0;background:#fff;border-radius:12px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;color:#5b6270;font-family:inherit}
.ag-tab-active{border-color:#2b6cb0;background:#eaf2fc;color:#2b6cb0}
.ag-gloss-item{background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ag-gloss-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:6px}
.ag-gloss-desc{font-size:14px;color:#4a5160;margin:0}
.ag-calc-row{margin-bottom:16px}
.ag-calc-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:6px}
.ag-calc-val{color:#2b6cb0;font-variant-numeric:tabular-nums}
.ag-calc-row input[type=range]{width:100%;height:8px;cursor:pointer;accent-color:#2b6cb0}
.ag-calc-result{background:#eaf2fc;border:1px solid #cfe0f5;border-radius:14px;padding:16px 18px;margin-top:6px}
.ag-calc-result h3{margin:0 0 8px;font-size:15px;color:#2b6cb0}
.ag-calc-line{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.ag-calc-big{font-size:24px;font-weight:800;color:#1e7a3c}
.ag-note{font-size:12px;color:#8a8f9a;margin-top:12px}
.ag-field{margin-bottom:14px}
.ag-field label{display:block;font-size:13px;font-weight:700;color:#5b6270;margin-bottom:6px}
.ag-select{width:100%;padding:11px 14px;border:2px solid #e4e8f0;border-radius:12px;font-size:15px;background:#fff;color:#2b2f36;font-family:inherit}
.ag-select:focus{outline:none;border-color:#2b6cb0}
.ag-alloc-bar{display:flex;height:30px;border-radius:10px;overflow:hidden;margin:12px 0 6px}
.ag-legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px;font-size:13px}
.ag-legend-item{display:flex;align-items:center;gap:6px;font-weight:600}
.ag-tips{list-style:none;padding:0;margin:0}
.ag-tip{background:#f7f8fb;border-left:3px solid #2b6cb0;border-radius:8px;padding:10px 14px;font-size:14px;color:#4a5160;margin-bottom:8px}
.ag-section-title{font-size:17px;font-weight:800;margin:0 0 12px}
.ag-rules{margin-bottom:20px}
.ag-rule{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:15px;font-weight:600;color:#3a4150}
.ag-rule span{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#2b6cb0;color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
.ag-btn{display:inline-block;border:none;cursor:pointer;border-radius:12px;font-size:16px;font-weight:700;padding:12px 24px;transition:transform .06s ease,opacity .2s;font-family:inherit}
.ag-btn:active{transform:translateY(1px)}
.ag-btn-primary{background:#2b6cb0;color:#fff}
.ag-btn-primary:hover{background:#255a94}
.ag-btn-disabled{opacity:.45;cursor:not-allowed}
.ag-hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;gap:8px;flex-wrap:wrap}
.ag-part{font-weight:700;color:#2b6cb0;background:#e3edfa;padding:3px 12px;border-radius:999px}
.ag-count{color:#6a7180;font-weight:600}
.ag-score{font-weight:700;color:#2e9e5b}
.ag-progress{height:8px;border-radius:8px;background:#e2e6ee;overflow:hidden;margin-bottom:18px}
.ag-progress-fill{height:100%;background:linear-gradient(90deg,#2b6cb0,#3a7bd5);border-radius:8px;transition:width .3s ease}
.ag-q h2{margin:0 0 8px;font-size:20px}
.ag-qtext{margin:0 0 18px;color:#4a5160;font-size:15px}
.ag-alloc-row{margin-bottom:16px}
.ag-alloc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ag-dot{width:12px;height:12px;border-radius:3px;flex:none}
.ag-alloc-label{font-weight:700;font-size:15px}
.ag-alloc-tag{font-size:12px;color:#8a8f9a}
.ag-alloc-val{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.ag-alloc-row input[type=range]{width:100%;height:8px;cursor:pointer;accent-color:#2b6cb0}
.ag-sum{text-align:center;font-size:15px;font-weight:700;color:#c0392b;margin:4px 0 16px}
.ag-sum-ok{color:#2e9e5b}
.ag-opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid #e4e8f0;border-radius:14px;padding:12px 16px;margin-bottom:10px;cursor:pointer;font-size:15px;color:#333a46;transition:border-color .15s,background .15s;font-family:inherit}
.ag-opt:hover{border-color:#b9c8de}
.ag-opt-selected{border-color:#2b6cb0;background:#eaf2fc}
.ag-opt-letter{flex:none;width:26px;height:26px;border-radius:50%;background:#eef1f6;color:#4a5160;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.ag-opt-selected .ag-opt-letter{background:#2b6cb0;color:#fff}
.ag-fb{border-radius:16px;background:#fff;border:1px solid #e6e9f0;padding:18px;margin-bottom:4px}
.ag-fb-badge{display:inline-block;font-weight:800;font-size:15px;padding:4px 14px;border-radius:999px;margin-bottom:12px}
.ag-fb-ok{background:#e5f6ea;color:#1e7a3c}
.ag-fb-no{background:#fdeaea;color:#c0392b}
.ag-fb-detail{font-size:14px;color:#4a5160;margin-bottom:6px}
.ag-fb-explain{font-size:14px;color:#5b6270;background:#f7f8fb;border-left:3px solid #2b6cb0;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.ag-result-emoji{font-size:56px;text-align:center}
.ag-result-rank{text-align:center;font-size:28px;font-weight:800;margin:4px 0 2px}
.ag-result-score{text-align:center;color:#5b6270;margin-bottom:20px}
.ag-recap{background:#fff;border:1px solid #e6e9f0;border-radius:14px;padding:16px 18px;margin-bottom:14px;text-align:left}
.ag-recap h3{margin:0 0 12px;font-size:16px;color:#2b6cb0}
.ag-recap-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;flex-wrap:wrap}
.ag-recap-pct{font-weight:800;width:40px;flex:none;font-variant-numeric:tabular-nums}
.ag-recap-name{font-weight:700}
.ag-recap-desc{color:#8a8f9a;font-size:12px}
.ag-recap-tip{font-size:13px;color:#5b6270;background:#f7f8fb;padding:10px 12px;border-radius:8px;margin:10px 0 0}
</style>
</head>

<div id="app"></div>

var GLOSSARY = [

  learnTab: 'glossary',

  rate: 6,
  years: 10,

function fmt(n) {
  var s = String(Math.round(n));
  var out = '';
  var cnt = 0;
  for (var i = s.length - 1; i >= 0; i--) {
    out = s[i] + out;
    cnt++;
    if (cnt % 3 === 0 && i > 0) out = ',' + out;
  }
  return out;
}

function computeAdvice(inputs) {
  var a = { debt: 40, equity: 30, insurance: 20, cash: 10 };
  var tips = [];
  var months = '3–4 个月';
  if (inputs.risk === '稳健型') { a.debt += 10; a.equity -= 10; tips.push('稳健型：提高债权类占比、降低增长类资产波动，以本金安全与稳定现金流优先。'); }
  else if (inputs.risk === '进取型') { a.debt -= 10; a.equity += 10; tips.push('进取型：可提高增长类占比博取长期增值，但需用保险与流动性守住底线。'); }
  else { tips.push('平衡型：维持 4321 基准，攻守兼备。'); }
  if (inputs.income === '浮动') { a.cash += 5; a.debt -= 5; months = '5–7 个月'; tips.push('收入浮动较大（营销/企业主）：流动性建议储备 5–7 个月日常开支，并适当提高现金缓冲。'); }
  else { tips.push('收入稳定（教师/公务员等）：流动性储备 3–4 个月即可。'); }
  if (inputs.scale === '高净值(500万+)') { tips.push('高净值家庭：建议增加全球分散配置与专业机构/家族办公室支持，关注税务与资产隔离。'); }
  else if (inputs.scale === '成长(50万–500万)') { tips.push('成长期：可逐步建立“攻守”双账户，稳健部分保底、进取部分增值。'); }
  else { tips.push('起步阶段：4321 同样适用，可按风险承受能力微调，重点是养成储蓄与配置习惯。'); }
  if (inputs.goal === '资产传承') { a.insurance += 5; a.equity -= 5; tips.push('传承目标：提高保险/寿险与信托类安排占比，实现财富有序传承与责任兑现。'); }
  else if (inputs.goal === '抗通胀保值') { a.equity += 5; a.debt -= 5; tips.push('抗通胀：适度增配增长类资产与大宗商品/黄金（参考全天候策略），对冲货币购买力稀释。'); }
  else if (inputs.goal === '兼顾流动性') { a.cash += 5; a.debt -= 5; tips.push('兼顾流动性：保留更厚现金垫，满足临时资金需求。'); }
  else { tips.push('财富增值：增长类是资产倍增主力，可结合美林时钟做战术微调。'); }
  tips.push('战术微调：结合美林投资时钟——滞胀配货币、衰退配债券、复苏配增长资产、繁荣配大宗商品，随周期轮动。');
  tips.push('长期底仓：可借鉴桥水全天候策略，同时配置货币、债券、增长类资产、大宗商品，“东方不亮西方亮”。');
  return { alloc: a, months: months, tips: tips };
}

function allocateBodyHtml() {
  var s = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var c = CATEGORIES[i];
    s += `<div class="ag-alloc-row"><div class="ag-alloc-head">` +
      `<span class="ag-dot" style="background:${c.color}"></span>` +
      `<span class="ag-alloc-label">${c.label}</span>` +
      `<span class="ag-alloc-tag">${c.tag}</span>` +
      `<span class="ag-alloc-val" id="alloc-val-${i}">${state.alloc[i]}%</span>` +
      `</div><input type="range" min="0" max="100" step="1" value="${state.alloc[i]}" style="accent-color:${c.color}" data-bind="alloc:${i}"></div>`;
  }
  var sum = state.alloc[0] + state.alloc[1] + state.alloc[2] + state.alloc[3];
  var ok = sum === 100;
  var hint = sum < 100 ? ('还差 ' + (100 - sum) + '%') : (sum > 100 ? ('超出 ' + (sum - 100) + '%') : '✓ 正好 100%');
  s += `<div class="ag-sum${ok ? ' ag-sum-ok' : ''}" id="alloc-sum">合计：${sum}%  ${hint}</div>`;
  s += `<button class="ag-btn ag-btn-primary${ok ? '' : ' ag-btn-disabled'}" id="alloc-submit" ${ok ? '' : 'disabled'} data-action="submit-allocate">提交配置</button>`;
  return s;
}

function choiceBodyHtml(r) {
  return `<div>` + optsHtml(r.options, state.selected, 'select-option') +

function feedbackHtml(r) {
  var f = state.feedback;

}

function sliderRow(label, valText, key, min, max, step, value) {
  return `<div class="ag-calc-row"><div class="ag-calc-head"><span>${label}</span><span class="ag-calc-val" id="calc-${key}">${valText}</span></div><input type="range" min="${min}" max="${max}" step="${step}" value="${value}" data-bind="${key}"></div>`;
}

function calculatorHtml() {
  var r = state.rate / 100 / 12, n = state.years * 12;
  var invested = state.monthly * n;
  var fv = r === 0 ? invested : state.monthly * ((Math.pow(1 + r, n) - 1) / r);
  var gain = fv - invested;
  return `<div>` +
    sliderRow('每月定投金额', '¥' + fmt(state.monthly), 'monthly', 0, 50000, 500, state.monthly) +
    sliderRow('预期年化收益率', state.rate + '%', 'rate', 0, 20, 0.5, state.rate) +
    sliderRow('投资年限', state.years + ' 年', 'years', 1, 40, 1, state.years) +
    `<div class="ag-calc-result" id="calc-result">` +
      `<h3>📊 复利测算结果</h3>` +
      `<div class="ag-calc-line"><span>累计投入</span><span>¥${fmt(invested)}</span></div>` +
      `<div class="ag-calc-line"><span>预计终值</span><span class="ag-calc-big">¥${fmt(fv)}</span></div>` +
      `<div class="ag-calc-line"><span>累计收益</span><span class="ag-calc-val">+¥${fmt(gain)}</span></div>` +
    `</div>` +
    `<p class="ag-note">💡 复利是年轻人最大的“时间红利”——越早开始、坚持越久，雪球滚得越大。此为演示测算，不构成收益承诺。</p>` +
  `</div>`;
}

    s += `<div class="ag-recap-row"><span class="ag-dot" style="background:${c.color}"></span><span class="ag-recap-pct">${c.target}%</span><span class="ag-recap-name">${c.label}（${c.tag}）</span><span class="ag-recap-desc">${c.desc}</span></div>`;

  s += `<p class="ag-recap-tip">流动性建议储备 3–6 个月开支：收入稳定 3–4 个月，收入浮动 5–7 个月；小资金家庭同样适用，可按风险承受能力微调。</p></div>`;
  s += `<div class="ag-recap"><h3>② 美林投资时钟</h3>`;
  for (var j = 0; j < MERRILL.length; j++) {
    var m = MERRILL[j];
    s += `<div class="ag-recap-row"><span class="ag-recap-pct">${m.phase}</span><span class="ag-recap-name">${m.trend}</span><span class="ag-recap-desc">→ ${m.asset}</span></div>`;
  }
  s += `</div>`;
  s += `<div class="ag-recap"><h3>③ 桥水 · 全天候策略</h3><p style="margin:0 0 8px;font-size:14px">达里奥不预测周期，同时配置货币、债券、增长类资产、大宗商品四类资产，核心逻辑是“东方不亮西方亮”，分散配置降低风险。</p><p class="ag-recap-tip">延伸：三大量化对冲机构 —— 西蒙斯的文艺复兴配置工具、达里奥的桥水配置工具、索罗斯的量子配置工具。</p></div>`;
  s += `<div style="text-align:center"><button class="ag-btn ag-btn-primary" data-action="restart">🔄 重新挑战</button></div></div>`;
  return s;
}

function submitChoice() {
  if (state.selected === null) return;
  var r = ROUNDS[state.roundIndex];
  var opt = r.options[state.selected];
  var earned = opt.correct ? 100 : 0;
  state.score += earned;
  state.feedback = { earned: earned, correct: opt.correct, explain: r.explain };
  render();
}

function submitAllocate() {
  var sum = state.alloc[0] + state.alloc[1] + state.alloc[2] + state.alloc[3];
  if (sum !== 100) return;
  var dev = 0, i;
  for (i = 0; i < 4; i++) dev += Math.abs(state.alloc[i] - CATEGORIES[i].target);
  var earned = Math.max(0, Math.round(100 - dev));
  state.score += earned;
  state.feedback = { earned: earned, correct: earned === 100, explain: ROUNDS[state.roundIndex].explain, detail: '目标比例：债权类40% · 增长类30% · 保险类20% · 流动性10%' };
  render();
}

function nextRound() {
  if (state.roundIndex + 1 >= ROUNDS.length) { state.stage = 'result'; render(); return; }
  state.roundIndex++;
  state.selected = null; state.alloc = [0, 0, 0, 0]; state.feedback = null;
  render();
}

function hqSubmit() {
  if (state.hqSelected === null) return;
  var q = HQ_ROUNDS[state.hqIndex];
  var o = q.options[state.hqSelected];
  state.hqScore += o.correct ? 100 : 0;
  state.hqFeedback = { correct: o.correct };
  render();
}

function allocLiveUI() {
  var sum = 0, i;
  for (i = 0; i < 4; i++) {
    sum += state.alloc[i];
    var v = document.getElementById('alloc-val-' + i);
    if (v) v.textContent = state.alloc[i] + '%';
  }
  var ok = sum === 100;
  var hint = sum < 100 ? ('还差 ' + (100 - sum) + '%') : (sum > 100 ? ('超出 ' + (sum - 100) + '%') : '✓ 正好 100%');
  var s = document.getElementById('alloc-sum');
  if (s) { s.textContent = '合计：' + sum + '%  ' + hint; s.className = 'ag-sum' + (ok ? ' ag-sum-ok' : ''); }
  var btn = document.getElementById('alloc-submit');
  if (btn) { btn.disabled = !ok; btn.className = 'ag-btn ag-btn-primary' + (ok ? '' : ' ag-btn-disabled'); }
}

function updateCalcResult() {
  var r = state.rate / 100 / 12, n = state.years * 12;
  var invested = state.monthly * n;
  var fv = r === 0 ? invested : state.monthly * ((Math.pow(1 + r, n) - 1) / r);
  var gain = fv - invested;
  document.getElementById('calc-result').innerHTML =
    `<h3>📊 复利测算结果</h3>` +
    `<div class="ag-calc-line"><span>累计投入</span><span>¥${fmt(invested)}</span></div>` +
    `<div class="ag-calc-line"><span>预计终值</span><span class="ag-calc-big">¥${fmt(fv)}</span></div>` +
    `<div class="ag-calc-line"><span>累计收益</span><span class="ag-calc-val">+¥${fmt(gain)}</span></div>`;
}

function handleClick(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  var i = el.getAttribute('data-i');
  switch (action) {
    case 'go-home': state.screen = 'home'; state.stage = 'intro'; state.advStep = 'form'; break;
    case 'go-game': state.screen = 'game'; break;
    case 'go-learn': state.screen = 'learn'; break;
    case 'go-advisor': state.screen = 'advisor'; break;
    case 'start-game': state.stage = 'playing'; state.roundIndex = 0; state.score = 0; state.selected = null; state.alloc = [0, 0, 0, 0]; state.feedback = null; break;
    case 'select-option': state.selected = Number(i); break;
    case 'submit-choice': submitChoice(); break;
    case 'submit-allocate': submitAllocate(); break;
    case 'next': nextRound(); break;
    case 'tab-glossary': state.learnTab = 'glossary'; break;
    case 'tab-calculator': state.learnTab = 'calculator'; break;
    case 'adv-tab-form': state.advStep = 'form'; break;
    case 'adv-tab-result': if (state.advResult) state.advStep = 'result'; break;
    case 'adv-tab-quiz': state.advStep = 'quiz'; state.hqIndex = 0; state.hqScore = 0; state.hqSelected = null; state.hqFeedback = null; break;
    case 'adv-generate': state.advResult = computeAdvice(state.inputs); state.advStep = 'result'; break;
    case 'hq-select': state.hqSelected = Number(i); break;
    case 'hq-submit': hqSubmit(); break;
    case 'hq-next': state.hqIndex++; state.hqSelected = null; state.hqFeedback = null; break;
    case 'hq-restart': state.hqIndex = 0; state.hqScore = 0; state.hqSelected = null; state.hqFeedback = null; break;
    case 'restart': state.stage = 'playing'; state.roundIndex = 0; state.score = 0; state.selected = null; state.alloc = [0, 0, 0, 0]; state.feedback = null; break;
  }
  render();
}

function handleInput(e) {
  var t = e.target;
  var b = t.getAttribute('data-bind');
  if (!b) return;
  if (b === 'monthly' || b === 'rate' || b === 'years') {
    state[b] = Number(t.value);
    document.getElementById('calc-' + b).textContent = b === 'monthly' ? '¥' + fmt(state.monthly) : (b === 'rate' ? state.rate + '%' : state.years + ' 年');
    updateCalcResult();
    return;
  }
  if (b.indexOf('alloc:') === 0) {
    state.alloc[Number(b.slice(6))] = Number(t.value);
    allocLiveUI();
    return;
  }
}

function handleChange(e) {
  var t = e.target;
  var b = t.getAttribute('data-bind');
  if (!b) return;
  if (b === 'scale' || b === 'risk' || b === 'income' || b === 'goal') state.inputs[b] = t.value;
}

function render() {
  var html;
  if (state.screen === 'home') html = homeHtml();
  else if (state.screen === 'learn') html = learnHtml();
  else if (state.screen === 'advisor') html = advisorHtml();
  else html = gameHtml();
  document.getElementById('app').innerHTML = html;
}

var app = document.getElementById('app');
app.addEventListener('click', handleClick);
app.addEventListener('input', handleInput);
app.addEventListener('change', handleChange);
render();
</script>
</body>
</html>
